<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buy&Sell Boss</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #050505, #171717, #003b5c);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.97);
      border-radius: 25px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,0.5);
    }

    .logo {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0088cc;
      margin-bottom: 18px;
    }

    .title {
      font-size: 25px;
      font-weight: bold;
      color: #111;
      margin-bottom: 18px;
    }

    .description {
      text-align: left;
      background: #f5f5f5;
      border-radius: 15px;
      padding: 18px;
      color: #222;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .join-button {
      display: block;
      width: 100%;
      padding: 17px 10px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0088cc, #0066a3);
      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0,136,204,0.35);
      transition: 0.2s;
    }

    .join-button:active {
      transform: scale(0.97);
    }

    .contact {
      margin-top: 18px;
      font-size: 13px;
      color: #777;
    }

    .contact a {
      color: #0088cc;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Telegram DP -->
    <img
      class="logo"
      src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg"
      alt="Telegram"
    >

    <!-- Title -->
    <div class="title"> Join Unlock App
